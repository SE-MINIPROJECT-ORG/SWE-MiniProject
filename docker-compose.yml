# Runs the whole system: database, mail catcher, backend API and frontend.
# Start:  docker compose up --build
# App: https://localhost:8443 (http://localhost:8080 redirects there)
# API for local tools only: http://localhost:5000/health   Mail: http://localhost:8025
services:
  # restart: unless-stopped brings a crashed service back automatically (EVT-NF-002).
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems_password
      POSTGRES_DB: ems
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgres://ems:ems_password@db:5432/ems
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      # Raise only for the load and concurrency tests (EVT-NF-001, EVT-NF-004).
      API_RATE_LIMIT: ${API_RATE_LIMIT:-100}
    # Apply migrations and test accounts, then start the API.
    command: sh -c "node db/migrate.js && node db/seed.js && node src/server.js"
    # Bound to this computer only, for local tools and tests. Browsers use HTTPS through the frontend.
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend

volumes:
  db_data:
