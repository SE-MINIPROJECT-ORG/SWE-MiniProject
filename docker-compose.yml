# Runs the whole system: database, mail catcher, backend API and frontend.
# Start:  docker compose up --build
# App: http://localhost:8080   API: http://localhost:5000/health   Mail: http://localhost:8025
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems_password
      POSTGRES_DB: ems
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgres://ems:ems_password@db:5432/ems
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    # Apply migrations and test accounts, then start the API.
    command: sh -c "node db/migrate.js && node db/seed.js && node src/server.js"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
