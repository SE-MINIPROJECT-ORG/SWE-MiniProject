# Local SonarQube server for static analysis (EVT-NF-005).
# Start: docker compose -f docker-compose.sonar.yml up -d   then open http://localhost:9000
services:
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions

volumes:
  sonar_data:
  sonar_extensions:
