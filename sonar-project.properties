sonar.projectKey=ems
sonar.projectName=Event Management System
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,backend/db,backend/scripts,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.js,**/*.test.jsx

# Backend coverage from "npm test" in backend/ (paths in the report start with backend/).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# EVT-NF-005 sets the 70% coverage target for the backend code. Test tools, database
# scripts and the frontend are left out of the coverage figure (the frontend has its
# own unit tests in CI, but no coverage target).
sonar.coverage.exclusions=backend/scripts/**,backend/db/**,frontend/**

# Wait for the quality gate result, so the scanner fails when the gate fails.
sonar.qualitygate.wait=true
