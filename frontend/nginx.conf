# Plain HTTP only redirects to HTTPS (EVT-SR-004).
server {
  listen 80;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 443 ssl;
  http2 on;

  # Self-signed certificate made when the image is built (see Dockerfile).
  # A real deployment uses a certificate from a certificate authority instead.
  ssl_certificate     /etc/nginx/certs/ems.crt;
  ssl_certificate_key /etc/nginx/certs/ems.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Security headers: force HTTPS in the browser and block common attacks.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  root /usr/share/nginx/html;
  index index.html;

  # Send API calls to the backend container.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /health {
    proxy_pass http://backend:5000;
  }

  # React Router: unknown paths load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
